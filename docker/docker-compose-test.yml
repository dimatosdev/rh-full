services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/sites/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend:/var/www/backend:ro
    restart: unless-stopped
    command: |
      sh -c "
        echo 'Testando configuração nginx...' &&
        nginx -t &&
        echo 'Configuração OK, iniciando nginx...' &&
        nginx -g 'daemon off;'
      "

